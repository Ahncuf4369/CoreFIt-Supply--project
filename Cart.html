<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CoreFit Supply | Cart</title>

    <link rel="stylesheet" href="CoreFit Supply.css">
</head>

<body>

    <header>
        <nav>

            <a class="logo" href="index.html">
                CoreFit Supply
            </a>

            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="checkout.html">Checkout</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>
    </header>


    <main>

        <section class="cart-section">

            <h1>Your Shopping Cart</h1>

            <p>
                Review the fitness equipment you have added to your cart.
            </p>


            <!-- JavaScript will display cart items here -->
            <div id="cart-list">

                <p>Your cart is currently empty.</p>

            </div>


            <section class="cart-summary">

                <h2>Cart Total</h2>

                <p>
                    Total:
                    <span id="cart-total">$0.00</span>
                </p>

            </section>


            <div class="cart-buttons">

                <!-- Clear the entire cart -->
                <button
                    id="clear-cart"
                    class="button"
                >
                    Clear Cart
                </button>


                <!-- Go to Checkout -->
                <a
                    href="checkout.html"
                    class="button"
                >
                    Proceed to Checkout
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            &copy; 2026 CoreFit Supply.
            Student project AHNCUF_4369.
        </p>

    </footer>


    <!-- Link to JavaScript -->
    <script src="CoreFit Supply.js"></script>

</body>

</html>
