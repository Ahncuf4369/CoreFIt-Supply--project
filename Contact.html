    <main>

        <section class="contact-section">

            <h1>Contact Us</h1>

            <p>
                Have a question about CoreFit Supply? Send us a message
                and we will get back to you.
            </p>


            <form id="contact-form">

                <label for="full-name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="full-name"
                    name="full-name"
                >


                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                >


                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    required
                ></textarea>


                <button type="submit" class="button">
                    Send Message
                </button>

                <p id="contact-message"></p>

            </form>

        </section>

    </main>
